[pytest]
testpaths = tests
base_url = https://videa.qrveo.com

markers =
    smoke: 主流程冒烟，不依赖额外数据（首页、多语言、手机菜单、FAQ）
    solutions: 套餐/试用/案例页，正文在 iframe 内渲染
    security: 匿名访客访问控制与接口鉴权
    media: 需要 QRVIDEA_QA_VIDEO_URL 的播放用例

addopts = -ra --strict-markers --screenshot=only-on-failure --output=artifacts/browser
